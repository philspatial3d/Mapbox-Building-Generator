<!doctype html><html lang="en"><head><link rel="icon" href="../../favicon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interior model review</title><style>body{margin:0;background:#ddd8ce;font:14px system-ui}header{position:absolute;z-index:2;padding:12px;background:#f8f6eeeb;border-radius:0 0 12px 0;max-width:min(540px,100vw);box-sizing:border-box}select,button{min-height:44px;font:inherit;max-width:100%;border:1px solid #87958c;border-radius:5px;background:#faf9f4}canvas{display:block;touch-action:none}p{margin:5px;font-size:12px}label{display:inline-block;margin:3px}</style></head><body><header><label>Model <select id="model" aria-label="Model"></select></label><label>Detail <select id="detail" aria-label="Detail"><option value="high">High</option><option value="low">Low</option></select></label><p id="credit"></p><p>Eye-level review · 1.5 m camera · drag to orbit</p><a href="../../app.html">Back to editor</a></header><script type="module">
import * as THREE from 'https://esm.sh/three@0.185.1';
import {GLTFLoader} from 'https://esm.sh/three@0.185.1/examples/jsm/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'https://esm.sh/three@0.185.1/examples/jsm/libs/meshopt_decoder.module.js';
import {createFixture} from './furniture.js';
import {palette,disposeFinishTextures} from './materials.js';
import {createInteriorEnvironment} from './lighting.js';
import {createContactMaterial} from './contact.js';
const manifest=await(await fetch('../../assets/interior/manifest.json')).json(),select=document.querySelector('#model'),detail=document.querySelector('#detail');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NeutralToneMapping;document.body.append(renderer.domElement);
const environment=createInteriorEnvironment(renderer),materials=palette('warm',environment.texture),owned=new Set(Object.values(materials));
const scene=new THREE.Scene();scene.background=new THREE.Color('#ddd8ce');scene.add(new THREE.HemisphereLight('#fff6e6','#706858',1.6));const sun=new THREE.DirectionalLight('#fff4df',1.6);sun.position.set(3,5,4);scene.add(sun);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.01,100),floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:'#c8c0b1',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);
const contactMaterial=createContactMaterial(),contact=new THREE.Mesh(new THREE.PlaneGeometry(1,1),contactMaterial);contact.rotation.x=-Math.PI/2;contact.position.y=.002;scene.add(contact);
const fixtures={bed:[1.6,2],sofa:[2.2,.9],dining_chair:[.45,.6],desk:[1.6,.8],chair:[.5,.5],table:[3.2,1.2],reception:[2.4,.9],counter:[2.4,.65],fridge:[.65,.7],wardrobe:[1.8,.6],shelving:[1.6,.45],wc:[.4,.65],basin:[.9,.5],shower:[.95,.95],bath_tub:[.8,1.75],lamp:[.34,.34],ceiling_light:[.42,.42],cubicle_screen:[1.6,.8]};
manifest.models.forEach(m=>select.add(new Option(m.id,m.id)));Object.keys(fixtures).forEach(id=>select.add(new Option(id+' · designed fixture','fixture:'+id)));
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);let current,generation=0,angle=.38,distance=3,targetY=.8;
function dispose(object){if(!object)return;scene.remove(object);const geometries=new Set(),mats=new Set(),textures=new Set(),images=new Set();object.traverse(o=>{if(!o.isMesh)return;geometries.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material])if(!owned.has(m)){mats.add(m);for(const t of Object.values(m))if(t?.isTexture&&!t.userData.sharedInteriorEnvironment){textures.add(t);if(t.image?.close)images.add(t.image);}}});geometries.forEach(g=>g.dispose());mats.forEach(m=>m.dispose());textures.forEach(t=>t.dispose());images.forEach(i=>i.close());}
function aim(){camera.position.set(Math.sin(angle)*distance,1.5,Math.cos(angle)*distance);camera.lookAt(0,targetY,0);}
async function show(){const n=++generation;document.body.dataset.ready='';let model,credit;if(select.value.startsWith('fixture:')){const id=select.value.slice(8),[w,d]=fixtures[id];const features=id==='counter'?[{kind:'sink',x:-.6,z:0,width:.4,depth:.32},...[-.13,.13].flatMap(x=>[-.12,.12].map(z=>({kind:'hob',x:x+.6,z,width:.16,depth:.16})))]:[];model=createFixture(id,w,d,materials,detail.value==='low',features);if(id==='counter'){const sink=createFixture('sink',.4,.32,materials,detail.value==='low');sink.position.x=-.6;model.add(sink);}credit='Project procedural fixture · metre dimensions · shared PBR finishes';}else{const asset=manifest.models.find(m=>m.id===select.value);model=(await loader.loadAsync('../../assets/interior/'+asset.id+'/'+detail.value+'.glb')).scene;model.traverse(o=>{if(o.isMesh)for(const m of Array.isArray(o.material)?o.material:[o.material]){m.envMap=environment.texture;m.envMapIntensity=.6;}});credit=asset.author+' · '+asset.licence;}
if(n!==generation){dispose(model);return;}dispose(current);current=model;scene.add(model);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3());distance=Math.max(2.4,size.z*1.45+size.x*.6);targetY=Math.min(1,size.y*.55);angle=.38;aim();contact.scale.set(Math.max(.1,size.x*1.1),Math.max(.1,size.z*1.1),1);let triangles=0;model.traverse(o=>{if(o.isMesh)triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;});document.querySelector('#credit').textContent=credit+' · '+Math.round(triangles).toLocaleString()+' triangles';document.body.dataset.ready=select.value;window.__modelReview={triangles,size:size.toArray()};}
select.onchange=show;detail.onchange=show;let pointer=null;renderer.domElement.onpointerdown=e=>{pointer=e.clientX;renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(pointer===null)return;angle-=(e.clientX-pointer)*.01;pointer=e.clientX;aim();};renderer.domElement.onpointerup=()=>pointer=null;renderer.domElement.onpointercancel=()=>pointer=null;
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});addEventListener('pagehide',()=>{dispose(current);Object.values(materials).forEach(m=>{m.normalMap?.dispose();m.dispose();});disposeFinishTextures();contactMaterial.map.dispose();contactMaterial.dispose();environment.dispose();renderer.dispose();});
await show();renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
