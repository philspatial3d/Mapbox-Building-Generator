<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Camera</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<!-- Figure model: "Rigged T-Pose Human Male w 50 Face Blendshapes" by Mike Alger
     (https://sketchfab.com/mikealger), CC BY 4.0. See CREDITS.md. -->
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  #feed, #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #scene { pointer-events: none; }
  #focus {
    position: fixed;
    width: 72px;
    height: 72px;
    margin: -36px 0 0 -36px;
    border: 1px solid rgba(255, 214, 10, 0.9);
    opacity: 0;
    pointer-events: none;
    transform: scale(1.25);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #focus.on { opacity: 1; transform: scale(1); }
  #blink {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }
  #blink.on { opacity: 0.85; transition: none; }
  #shutter {
    position: fixed;
    left: 50%;
    bottom: calc(26px + env(safe-area-inset-bottom));
    width: 72px;
    height: 72px;
    margin-left: -36px;
    border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.95);
    background: transparent;
    padding: 0;
    cursor: pointer;
  }
  #shutter::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    transition: transform 0.1s ease;
  }
  #shutter:active::after { transform: scale(0.9); }
  #exit {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    width: 44px;
    height: 44px;
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    opacity: 0.8;
  }
  #exit svg { width: 18px; height: 18px; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5)); }
  button:focus-visible { outline: 2px solid #ffd60a; outline-offset: 3px; }
  #notice, #sheet {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: min(320px, calc(100% - 48px));
    color: #f2f2f2;
    text-align: center;
    font-size: 15px;
    line-height: 1.4;
  }
  #notice { top: 42%; }
  #sheet {
    bottom: calc(24px + env(safe-area-inset-bottom));
    background: rgba(28, 28, 30, 0.96);
    border-radius: 14px;
    padding: 18px 16px 14px;
    box-sizing: border-box;
  }
  #notice p, #sheet p { margin: 0 0 14px; }
  #notice button, #sheet button {
    display: block;
    width: 100%;
    min-height: 44px;
    margin-top: 8px;
    border: 0;
    border-radius: 10px;
    font: inherit;
    color: #fff;
    background: rgba(255, 255, 255, 0.14);
    cursor: pointer;
  }
  #sheet #leave { background: #fff; color: #000; font-weight: 600; }
  #sheet .small { margin: 14px 0 0; font-size: 12px; color: rgba(255, 255, 255, 0.55); }
  #sheet .credit { margin: 6px 0 0; font-size: 11px; color: rgba(255, 255, 255, 0.4); }
  #sheet .credit a { color: inherit; }
  [hidden] { display: none !important; }
  #debug {
    position: fixed;
    top: 4px;
    right: 6px;
    font: 11px/1.3 ui-monospace, Menlo, monospace;
    color: #0f0;
    text-shadow: 0 0 2px #000;
    pointer-events: none;
    white-space: pre;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<video id="feed" playsinline muted autoplay></video>
<canvas id="scene"></canvas>
<div id="focus"></div>
<div id="blink"></div>
<button id="exit" type="button" aria-label="Close camera">
  <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
</button>
<button id="shutter" type="button" aria-label="Take photo"></button>
<div id="notice" hidden>
  <p id="noticeText"></p>
  <button id="retry" type="button">Try again</button>
</div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <p id="sheetTitle">Close the camera?</p>
  <button id="leave" type="button">Close</button>
  <button id="stay" type="button">Keep using camera</button>
  <p class="small">Stay aware of traffic and the people around you.</p>
  <p class="credit">Figure model by <a href="https://sketchfab.com/mikealger" target="_blank" rel="noopener">Mike Alger</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.</p>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
